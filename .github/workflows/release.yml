name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the manifest ships a build Chrome will treat
      # as the wrong version. Fail loudly instead.
      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "tag is $tag but manifest.json says $manifest" >&2
            exit 1
          fi

      - name: Check
        run: node --check background.js && node test.mjs

      # Only the files Chrome loads -- no docs, tests, or SVG source.
      - name: Build package
        run: zip -r "${GITHUB_REF_NAME}.zip" manifest.json background.js icons/*.png

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "${GITHUB_REF_NAME}.zip"
